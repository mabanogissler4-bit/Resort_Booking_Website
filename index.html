<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosmont Hills Resort Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="brand">
        <h1>Rosmont Hills Resort</h1>
        <p>Your comfort, our priority.</p>
    </div>
</header>

<main class="booking-container">
    <section class="heading">
        <p class="eyebrow">RESORT RESERVATION</p>
        <h2>Book Your Stay</h2>
        <p>Complete the form below to request your reservation.</p>
    </section>

    <form id="bookingForm" novalidate>
       <a href="index.html" class="book-now-link">Book Now</a>
        <h3>1. Guest Details</h3>

        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName"
               placeholder="Enter your full name" required>

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email"
               placeholder="example@email.com" required>

        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number" required>

        <h3>2. Reservation Details</h3>

        <div class="form-grid">
            <div>
                <label for="checkIn">Check-In Date *</label>
                <input type="date" id="checkIn" name="checkIn" required>
            </div>

            <div>
                <label for="checkOut">Check-Out Date *</label>
                <input type="date" id="checkOut" name="checkOut" required>
            </div>
        </div>

        <label for="room">Room Selection *</label>
        <select id="room" name="room" required>
            <option value="">Select a room</option>
            <option value="Deluxe Suite">Deluxe Suite</option>
            <option value="Ocean View Villa">Ocean View Villa</option>
            <option value="Standard Room">Standard Room</option>
            <option value="Family Suite">Family Suite</option>
        </select>

        <div class="form-grid">
            <div>
                <label for="adults">Number of Adults *</label>
                <input type="number" id="adults" name="adults"
                       min="1" max="20" value="1" required>
            </div>

            <div>
                <label for="children">Number of Children</label>
                <input type="number" id="children" name="children"
                       min="0" max="20" value="0" required>
            </div>
        </div>

        <label for="requests">Special Requests / Notes (Optional)</label>
        <textarea id="requests" name="requests" rows="4"
                  placeholder="Enter any special requests"></textarea>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="button-group">
            <button type="button" id="checkButton" class="check-button">
                Check Availability
            </button>

            <button type="submit" class="book-button">
                Book Now
            </button>
        </div>

        <p class="note">* Required fields. Reservations are subject to confirmation.</p>
    </form>
</main>

<footer>
    <p>&copy; 2026 Rosmont Hills Resort</p>
</footer>

<script src="script.js"></script>
</body>
</html>
